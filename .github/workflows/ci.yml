name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest tests -q -p no:cacheprovider
      # A script committed without its executable bit fails here, not silently in a hook.
      - if: runner.os != 'Windows'
        run: ./bin/lifecycle version && test -x .githooks/pre-push

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff==0.14.1 check tools tests
      - run: pipx run ruff==0.14.1 format --check tools tests

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx -y @anthropic-ai/claude-code plugin validate . --strict
